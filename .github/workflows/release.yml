name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Monaco vendor dosyalarını hazırla
        run: npm run vendor:monaco
      - name: Test paketi
        run: npm test
      # İmzalama: repo secret'larına CSC_LINK (base64 .pfx) ve CSC_KEY_PASSWORD
      # eklenirse electron-builder installer'ı otomatik imzalar; yoksa imzasız üretir.
      - name: NSIS installer üret
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis --publish never
      - name: Installer'ı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: lux-ai-windows-nsis
          path: |
            dist/*.exe
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Monaco vendor dosyalarını hazırla
        run: npm run vendor:monaco
      - name: AppImage üret
        run: npx electron-builder --linux AppImage --publish never
      - name: AppImage'ı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: lux-ai-linux-appimage
          path: |
            dist/*.AppImage
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Artifact'leri indir
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release oluştur ve dosyaları ekle
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/latest*.yml
          generate_release_notes: true

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Bağımlılıkları kur (kilit dosyasına birebir uy)
        run: npm ci

      - name: Güvenlik denetimi (yüksek ve üzeri açıklar CI'ı kırar)
        run: npm audit --audit-level=high

      - name: Derlenmiş CSS güncel mi? (tailwind.input.css değişip compiled unutulduysa yaka)
        run: |
          npm run css:build
          git diff --exit-code -- src/css/compiled_tailwind.css || (echo "::error::src/css/compiled_tailwind.css güncel değil — 'npm run css:build' çalıştırıp sonucu commit'leyin" && exit 1)

      - name: Monaco vendor dosyalarını hazırla
        run: npm run vendor:monaco

      - name: Test paketi
        run: npm test

      - name: Lint (statik hata yakalama)
        run: npm run lint

      - name: Format (Prettier — biçim sapması CI'ı kırar)
        run: npx prettier --check .

      # Başsız gerçek çalışma döngüsü testi (açılış -> IPC -> kapanış).
      # Windows'ta GUI session bulunduğu için doğrudan çalışır; headless
      # Linux'ta xvfb gerekir.
      - name: Gerçek çalışma döngüsü testi (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgtk-3-0 libxkbcommon0 libxdamage1 libgbm1 libasound2t64
          xvfb-run -a node node_modules/electron/cli.js scripts/e2e_runtime.js

      - name: Gerçek çalışma döngüsü testi (Windows)
        if: runner.os == 'Windows'
        run: node node_modules/electron/cli.js scripts/e2e_runtime.js

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Python sözdizimi
        run: python -m py_compile scripts/voice_service.py scripts/xtts_worker.py
